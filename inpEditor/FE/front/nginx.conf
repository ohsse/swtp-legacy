server {
    listen 30090;
    server_name _;

    # SPA: 정적 파일 없으면 index.html 로
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # /api 프리픽스 유지한 채 BE 로 (끝 슬래시 없음! BE context-path=/api)
    location /api/ {
        proxy_pass http://be:30091;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # BE forward-headers-strategy=framework
        client_max_body_size 50m;                     # INP 업로드 한도와 정합

        # 성능곡선 갱신은 TB_RAWDATA 기간 집계 + 파이썬 회귀로 수 분이 걸릴 수 있어
        # 기본 60초(proxy_read_timeout 기본값)에 걸려 504 가 났다. 응답 대기시간을 늘린다.
        # (BE python-data read-timeout 과 정렬: nginx ≥ BE. 근본 해결은 조회기간 제한/쿼리 최적화)
        proxy_connect_timeout 5s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}