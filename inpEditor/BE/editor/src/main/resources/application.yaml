spring:
  application:
    name: editor

  # ===== 파일 업로드 (multipart) =====
  # INP 파일 업로드 크기 한도. 환경에 따라 환경변수로 오버라이드 가능합니다.
  servlet:
    multipart:
      max-file-size: ${EDITOR_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${EDITOR_MULTIPART_MAX_REQUEST_SIZE:50MB}
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  # ===== 데이터베이스 (MariaDB) =====
  # 기본값은 개발용 접속 정보이며, 운영 환경에서는 환경변수로 오버라이드합니다.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/ems_db_gs_dump_260410}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  # ===== JPA / Hibernate =====
  jpa:
    open-in-view: false              # OSIV 비활성화 (지연 로딩 범위를 트랜잭션으로 한정)
    hibernate:
      ddl-auto: validate             # 스키마는 Flyway가 관리, JPA는 매핑 검증만 수행
    show-sql: true                   # 개발 단계 SQL 로깅 (운영 시 false 권장)
    properties:
      hibernate:
        format_sql: true

  # ===== Flyway (DB 스키마 버전 관리) =====
  flyway:
    enabled: false
    baseline-on-migrate: false        # 기존 DB에 최초 적용 시 baseline 자동 생성
    baseline-version: 0              # baseline 을 V0 으로 (기본 V1 이면 V1 이 건너뛰어져 V2 FK 가 errno 150 실패)
    locations: classpath:db/migration

# ===== 서블릿 인코딩 =====
# 멀티파트 폼 필드(예: 한글 파일명 등) 요청 파라미터를 UTF-8 로 강제 디코딩한다.
# ===== 애플리케이션 파일 저장소 =====
# INP 원본/백업 파일 저장 기준 경로. 환경에 따라 변경 가능하며 환경변수로 오버라이드합니다.
# (Windows 경로는 역슬래시 이스케이프 문제를 피하기 위해 슬래시 '/'로 표기 — Java가 동일하게 처리)
editor:
  storage:
    base-path: ${EDITOR_STORAGE_BASE_PATH:C:/dev/files}

  # ===== 네트워크 상세조회 =====
  # INP 좌표는 한국 투영좌표(미터)입니다. 정확한 EPSG는 파일/지자체마다 다를 수 있어 기본값을 비워둡니다.
  # 실제 좌표계를 알면 환경변수로 지정하세요(예: EPSG:5186). 미지정 시 응답 meta.crs 는 UNKNOWN 으로 표기됩니다.
  network:
    coordinate-crs: ${EDITOR_NETWORK_COORDINATE_CRS:}

  # ===== 관망해석 시뮬레이션 =====
  # 분석시각 조회의 정수장 송수유량 태그번호. 지자체별로 다를 수 있어 환경변수로 오버라이드 가능합니다.
  simulation:
    out-flow-tag: ${EDITOR_SIMULATION_OUT_FLOW_TAG:701-367-FRI-4007}

  # ===== 모델 적용 (에디터 → EPANET 해석엔진) =====
  # "적용" 시 현재 리비전의 물리 파일을 storage.base-path 루트에 아래 파일명들로 원자적으로 덮어쓴다.
  # epa 컨테이너가 같은 디렉터리를 /app/inp 로 함께 보고 있고 매 요청마다 파일을 다시 읽으므로,
  # 재기동 없이 관망해석에 반영된다.
  # 시뮬레이션(si)과 모니터링(mo)은 항상 같은 모델을 써야 하므로 두 대상을 같은 내용으로 함께 교체한다.
  # 주의: 이 파일명들은 epa 의 config.py 에 있는 INP_SI_FILE_PATH / INP_MO_FILE_PATH 의 파일명과
  #       반드시 일치해야 한다. 어긋나면 적용은 성공하지만 해석엔진은 예전 파일을 계속 읽는다.
  # (gs_inp.inp 는 epa 파이썬 코드에서 참조되지 않는 죽은 설정이라 교체 대상에서 제외한다.)
  # si/mo 를 한 파일로 운영하는 현장은 아래 두 환경변수에 같은 파일명을 넣으면 된다.
  # 중복은 서비스에서 하나로 접혀 그 파일 하나만 교체된다(InpFileService.requireApplyTargets).
  apply:
    target-file-names:
      - ${EDITOR_APPLY_SI_FILE_NAME:gs_inp_si.inp}
      - ${EDITOR_APPLY_MO_FILE_NAME:gs_inp_mo.inp}

  # ===== CORS =====
  # 프론트엔드(별도 오리진)에서의 브라우저 요청을 허용합니다. 기본은 전체 허용(*)이며,
  # 운영 환경에서는 환경변수로 특정 오리진만 지정하는 것을 권장합니다(쉼표로 구분: http://a,http://b).
  cors:
    allowed-origins: ${EDITOR_CORS_ALLOWED_ORIGINS:*}

  # ===== 파이썬 최적화 모듈 연동 =====
  # 최적화 실행 시 이력(hist) 저장 후, 이력 ID 만 파이썬 API 로 전달합니다.
  # 파이썬은 해당 ID 로 별도 프로세스를 실행하므로 긴 처리는 기다리지 않고, "요청 접수" 응답만 받습니다.
  # 로컬 기본 포트는 8090 입니다(개발 tenant 는 resources-env/dev 에서 30092 로 오버라이드).
  python:
    base-url: ${EDITOR_PYTHON_BASE_URL:http://localhost:30092}
    optimize-path: ${EDITOR_PYTHON_OPTIMIZE_PATH:/optimize}
    connect-timeout-ms: ${EDITOR_PYTHON_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${EDITOR_PYTHON_READ_TIMEOUT_MS:5000}

  # ===== 파이썬 데이터 조회/계산 모듈 연동 (두 번째 API) =====
  # 위 최적화(python.*)와 독립된 별도 파이썬 API. 개발 tenant 포트는 30093 이며,
  # 로컬 기본 포트는 8091 입니다(resources-env/<profile> 에서 30093 으로 오버라이드).
  # 동기 호출로 계산 결과를 받아 사용하므로 읽기 타임아웃을 길게 둡니다.
  python-data:
    base-url: ${EDITOR_PYTHON_DATA_BASE_URL:http://localhost:30093}
    connect-timeout-ms: ${EDITOR_PYTHON_DATA_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${EDITOR_PYTHON_DATA_READ_TIMEOUT_MS:30000}

server:
  port: 8080