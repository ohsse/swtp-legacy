# \uC18C\uBE44\uC790 \uB9C8\uC2A4\uD130 \uC2A4\uC704\uCE58. \uC6B4\uC804\u00B7\uCD94\uCC9C\u00B7\uBD84\uC11D\uC740 AI \uC6B4\uC804\uBAA8\uB4DC(TB_WPP_TAG_CODE FUNC_TYP=PumpStatus), \uBC38\uBE0C \uC81C\uC5B4 \uD0DC\uADF8\uB294 DB(FUNC_TYP=CtrlCmdTag)\uC5D0 \uC788\uB2E4
ctrl.cmd.consumer.enabled=true
# \uC801\uC7AC \uC8FC\uAE30(\uB9E4\uBD84 40\uCD08)\uC640 \uBC18\uC601 \uD310\uC815 \uC8FC\uAE30
ctrl.cmd.consumer.cron=40 * * * * *
ctrl.cmd.judge.cron=15,45 * * * * *
# \uBCA4\uB354 \uD310\uB2E8 \uC8FC\uAE30(\uBD84)\uC640 \uD310\uB2E8 \uB9C8\uAC10 \uC5EC\uC720(\uCD08). \uBBF8\uCC98\uB9AC \uBA85\uB839\uC740 \uB2E4\uC74C \uD310\uB2E8 20\uCD08 \uC804\uC5D0 \uC885\uACB0(\uCD94\uCC9C \uBB34\uC751\uB2F5 REJECTED)
ctrl.cmd.cycle-min=5
ctrl.cmd.decision-close-sec=20
# \uC1A1\uC2E0 \uBBF8\uC644\uB8CC \uC2E4\uD328 \uD310\uC815(\uBD84)
