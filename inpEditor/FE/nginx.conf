server {
    listen 30090;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Docker 내장 DNS(127.0.0.11)로 매 요청마다 백엔드 주소를 다시 해석한다.
        # proxy_pass 에 호스트명을 리터럴로 쓰면 nginx 가 기동 시 1회만 해석하고 캐시하는데,
        # inp-editor-be 를 재생성하면(예: 최초 배포의 Flyway 스키마 생성 절차) 컨테이너 IP 가
        # 바뀌어 nginx 가 옛 IP 로 붙다가 502 를 낸다. 변수로 쓰면 valid= 주기로 재해석된다.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $inp_editor_be inp-editor-be;
        proxy_pass http://$inp_editor_be:30091$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;

        proxy_connect_timeout 5s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # 폐쇄망 배경지도 타일. front/src/consts/map.js 가 비-dev 프로파일에서 base 를
    # '/newEMap/' 상대경로로 떨어뜨리므로, 같은 오리진인 여기서 받아 tile-server 로 넘긴다.
    # (절대 URL 로 붙이면 서버 IP 종속 + CORS 가 따라온다 — /api/ 와 같은 이유다)
    #
    # 리터럴 호스트명을 쓰면 안 된다. tile-server 는 tiles 프로파일로 격리되어 없을 수도
    # 있는데, 리터럴이면 nginx 가 기동 시 DNS 해석에 실패해 이 FE 컨테이너 전체가 못 뜬다.
    # 변수로 쓰면 기동은 정상이고 타일 요청만 502 가 난다(배경도만 빠지고 관망은 정상).
    location /newEMap/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $tile_server tile-server;
        proxy_pass http://$tile_server:25000$request_uri;
        proxy_set_header Host $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
