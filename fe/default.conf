server {
    # 10013 포트에서 요청을 수신합니다.
    listen 10013;
    server_name localhost;

    location / {
        # 파일이 있는 루트 디렉토리입니다.
        root   /usr/share/nginx/html;
        # 기본 인덱스 파일입니다.
        index  index.html index.htm;
        # 파일이 존재하지 않을 경우 index.html로 리디렉션합니다.
        try_files $uri $uri/ /index.html;
    }

    # 5xx 에러 페이지를 설정합니다.
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # ────────────────────────────────────────────────────────────────────────
    # 다른 현장에 이 프런트를 올릴 때 주의:
    # 아래 두 블록은 백엔드가 같은 도커 네트워크에 'ems-java-api', 'ems-py-api' 라는
    # 서비스명으로 있다는 전제다(이 리포의 compose 3종은 전부 그 이름을 쓴다).
    # 백엔드가 도커 밖에 있거나 이름이 다른 현장이라면 set 줄의 이름과 포트를 그 현장에
    # 맞게 바꿔야 한다. 안 바꾸면 API 가 전부 502 가 되어 화면이 통째로 죽는다.
    # (예전처럼 절대 URL 을 번들에 박는 방식으로 되돌리는 것은 권하지 않는다 — 그러면
    #  현장마다 프런트를 다시 말아야 하고 CORS 도 따라온다.)
    # ────────────────────────────────────────────────────────────────────────

    # EMS 백엔드(Spring). src/main.js 의 $apiURL 이 '/ems-api' 라서 449곳의 호출이
    # `/ems-api/login/checkTkn` 같은 상대경로로 나온다. 여기서 받아 접두사를 떼고 넘긴다.
    #
    # rewrite 가 필요한 이유: proxy_pass 에 변수가 들어가면 nginx 는 "URI 를 지정해도
    # 그것을 그대로 보낸다". 즉 proxy_pass http://$var/; 라고 쓰면 모든 요청이 '/' 하나로
    # 뭉개진다(리터럴 호스트명일 때만 끝 슬래시가 접두사를 떼는 동작을 한다).
    # 그래서 rewrite 로 $uri 를 먼저 깎고, proxy_pass 에는 URI 를 붙이지 않는다.
    #
    # 변수를 쓰는 이유는 /newEMap/ 과 같다 — 리터럴이면 기동 시 DNS 해석에 실패했을 때
    # 이 프런트 컨테이너 전체가 못 뜬다.
    #
    # 포트는 컨테이너 내부 포트이고 스프링 프로파일이 정한다(dev=9000, gu=10014).
    # 이 파일은 9000 을 기본으로 두고, 운영(gu)용은 Dockerfile.gunsan-prod 가
    # EMS_API_UPSTREAM_PORT 로 이 줄을 치환한다.
    location /ems-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        # 호스트와 포트를 한 변수에 담는다. Dockerfile.gunsan-prod 가 아래 줄의
        # <서비스명>:<포트> 를 통째로 치환하므로 둘을 떼어 놓으면 치환이 빗나간다.
        set $ems_api ems-java-api:9000;
        rewrite ^/ems-api/(.*)$ /$1 break;
        proxy_pass http://$ems_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;

        proxy_connect_timeout 5s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # EPANET 해석 서비스(gunicorn). $pythonURL 이 '/epa' 다. 이쪽 호출 경로는 원래부터
    # /api/ 로 시작해서(`${pythonURL}/api/web/monitoring`) 접두사를 /api 로 두면
    # EMS 백엔드와 구분이 안 된다. 그래서 /epa 를 쓰고 여기서 떼어낸다.
    # gunicorn bind 는 23002 고정이라 환경별로 다르지 않다.
    location /epa/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $epa_api ems-py-api;
        # /api/web/network 가 관망 전체를 GeoJSON 으로 내려보낸다. 고산 관망(절점 515,
        # 관로 533, 정점 1만여 개)은 1MB 에 가까워 폐쇄망 회선에서 체감된다. 좌표 숫자라
        # 압축률이 높다. 작은 응답(모니터링 등)은 gzip_min_length 로 그냥 통과시킨다.
        gzip on;
        gzip_types application/json;
        gzip_min_length 10240;
        gzip_proxied any;
        rewrite ^/epa/(.*)$ /$1 break;
        proxy_pass http://$epa_api:23002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;

        proxy_connect_timeout 5s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # 폐쇄망 배경지도 타일. src/components/Map/MapComponent.vue 가 '/newEMap/...' 상대경로로
    # 타일을 요청하므로, 같은 오리진인 여기서 받아 tile-server 로 넘긴다.
    # 예전에는 http://localhost:25000 (고산 운영 타일서버)을 직접 박아 두었는데,
    # 그러면 현장마다 프런트를 다시 말아야 하고 CORS 도 따라온다.
    #
    # 리터럴 호스트명을 쓰면 안 된다. tile-server 는 tiles 프로파일로 격리되어 없을 수도
    # 있는데, 리터럴이면 nginx 가 기동 시 DNS 해석에 실패해 이 프런트 전체가 못 뜬다.
    # 변수로 쓰면 기동은 정상이고 타일 요청만 502 가 난다(배경도만 빠진다).
    location /newEMap/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $tile_server tile-server;
        proxy_pass http://$tile_server:25000$request_uri;
        proxy_set_header Host $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
