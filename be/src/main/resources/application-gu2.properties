#
#   1) Kafka \uCEE8\uC288\uBA38/\uD504\uB85C\uB4C0\uC11C (kafka/consumer/*, kafka/producer/*)
#      @Profile \uD654\uC774\uD2B8\uB9AC\uC2A4\uD2B8 \uBC29\uC2DD\uC774\uB77C gu2 \uB97C \uB123\uC9C0 \uC54A\uB294 \uAC83\uC774 \uACE7 \uBE44\uD65C\uC131\uD654\uB2E4.
#      \uAC19\uC740 group.id \uB85C \uC870\uC778\uD558\uBA74 \uD30C\uD2F0\uC158\uC774 \uAC08\uB824 \uAE30\uC874 \uC571\uC774 SCADA \uB97C \uC808\uBC18\uB9CC \uBC1B\uB294\uB2E4.
#   2) \uAD6C Kafka (kafka/KafkaConfig, KafkaConsumerService, KafkaProducerTasks)
#      \uC774\uCABD\uC740 \uBE14\uB799\uB9AC\uC2A4\uD2B8\uB77C \uAC01 @Profile \uC5D0 !gu2 \uB97C \uC9C1\uC811 \uCD94\uAC00\uD574 \uB9C9\uC558\uB2E4.
#   3) \uBAA8\uB4E0 @Scheduled (SchedulerService / AlarmService / DrvnConfig / PumpScheduler
#      / KafkaProducerTasks) - SchedulerConfig \uC5D0 @Profile("!gu2") \uB97C \uAC78\uC5B4
#      @EnableScheduling \uC790\uCCB4\uB97C \uB048\uB2E4. \uAC1C\uBCC4 \uD074\uB798\uC2A4\uB97C \uB044\uC9C0 \uC54A\uB294 \uC774\uC720\uB294 AlarmService \uAC00
#      @Profile \uC5C6\uB294 @Service \uC774\uACE0 AlarmController/AiService \uAC00 \uC758\uC874\uD558\uAE30 \uB54C\uBB38\uC774\uB2E4.
#
# server.port \uB294 gu \uC640 \uAC19\uC740 10014 \uB97C \uC720\uC9C0\uD55C\uB2E4. \uCEE8\uD14C\uC774\uB108 \uB0B4\uBD80 \uD3EC\uD2B8\uB77C \uBCD1\uD589 \uAE30\uB3D9\uD574\uB3C4
